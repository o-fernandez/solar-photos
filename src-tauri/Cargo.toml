[package]
name = "solar-photos"
version = "0.1.0"
description = "A local-first photo library manager"
authors = ["Solar Photos"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (Windows quirk).
name = "solar_photos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Backend pipeline
rusqlite = { version = "0.32", features = ["bundled"] }   # bundled = no system sqlite needed
jwalk = "0.8"                                             # fast parallel directory walk
image = "0.25"                                            # decode/encode jpeg/png/webp
sha2 = "0.10"                                             # cache-key hashing
anyhow = "1"                                              # ergonomic error handling in workers
kamadak-exif = "0.5"                                      # read EXIF capture date (the timeline spine)
ort = { version = "=2.0.0-rc.10", features = ["coreml", "ndarray"] }  # ONNX Runtime: face detect + embed
ndarray = "0.16"                                          # tensor construction for ONNX I/O

# HEIC/HEIF decode: macOS uses the system ImageIO framework (raw FFI, no crate needed).
# Windows/Linux fall back to the bundled libheif.
[target.'cfg(not(target_os = "macos"))'.dependencies]
libheif-rs = "1.0"

[profile.release]
# Smaller, faster release binaries.
codegen-units = 1
lto = true
opt-level = "s"

# Debug installs must not be numerically slow: the clustering/suggestion passes are
# dense matrix math (ndarray/matrixmultiply) and image decoding, which at opt-level 0
# run ~50x slower — a "Reorganizing people…" pass once pegged a core for an hour.
# Optimize all dependencies fully and our own crate lightly (still debuggable).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
